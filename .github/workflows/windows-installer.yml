name: Windows desktop installer

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build and smoke-test unsigned Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Test desktop security helpers
        run: npm run test:desktop

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'windows-installer-build.log'
          npm run desktop:dist:win *>&1 | Tee-Object -FilePath $logPath
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content $logPath -Tail 50) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer build failed::$escaped"
            exit $buildExitCode
          }

      - name: Smoke-test the packaged renderer and preload bridge
        shell: pwsh
        run: |
          $env:CLIPWRIGHT_SMOKE_TEST = '1'
          $reportPath = Join-Path $env:RUNNER_TEMP 'deterministic-webm-smoke.json'
          $env:CLIPWRIGHT_SMOKE_REPORT_PATH = $reportPath
          $appPath = Join-Path 'release\win-unpacked' 'ClipWright Studio.exe'
          if (-not (Test-Path $appPath)) {
            throw "Packaged application executable not found: $appPath"
          }
          $process = Start-Process -FilePath $appPath -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path $reportPath)) {
            throw 'Packaged application did not write the deterministic WebM export measurements.'
          }
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if (-not $report.pass) {
            throw "Deterministic WebM frame-count or duration gate failed: $($report | ConvertTo-Json -Depth 8 -Compress)"
          }
          @"
          ## Packaged Windows deterministic WebM export smoke
          - Expected: $($report.expected.frameCount) frames at $($report.expected.frameRate.numerator)/$($report.expected.frameRate.denominator) fps; frame-aligned video duration $($report.expected.frameAlignedVideoDurationSeconds)s.
          - Frame counts: requested $($report.counts.requested), rendered $($report.counts.rendered), submitted $($report.counts.submitted), encoded $($report.counts.encoded), output file $($report.counts.outputFile).
          - Video: $($report.actual.videoDurationSeconds)s (delta $($report.actual.videoDurationDeltaSeconds)s), measured rate $($report.actual.measuredVideoFrameRate) fps, $($report.actual.videoDimensions.width)x$($report.actual.videoDimensions.height).
          - Audio: $($report.actual.audioDurationSeconds)s (delta $($report.actual.audioDurationDeltaSeconds)s); container: $($report.actual.containerDurationSeconds)s (delta $($report.actual.containerDurationDeltaSeconds)s).
          - One-frame duration tolerance: $($report.expected.oneFrameToleranceSeconds)s. Gate: PASS.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ClipWright-Windows-build-diagnostics
          path: ${{ runner.temp }}/windows-installer-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v7
        with:
          name: ClipWright-Windows-unsigned-x64
          path: release/ClipWright-Studio-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
