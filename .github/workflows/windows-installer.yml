name: Windows desktop installer

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  windows-installer:
    name: Build and smoke-test unsigned Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm test

      - name: Test desktop security helpers
        run: npm run test:desktop

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'windows-installer-build.log'
          npm run desktop:dist:win *>&1 | Tee-Object -FilePath $logPath
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content $logPath -Tail 50) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer build failed::$escaped"
            exit $buildExitCode
          }

      - name: Smoke-test the packaged renderer and preload bridge
        id: packaged-smoke
        shell: pwsh
        run: |
          $env:CLIPWRIGHT_SMOKE_TEST = '1'
          $reportPath = Join-Path $env:RUNNER_TEMP 'deterministic-webm-smoke.json'
          $env:CLIPWRIGHT_SMOKE_REPORT_PATH = $reportPath
          $appPath = Join-Path 'release\win-unpacked' 'ClipWright Studio.exe'
          if (-not (Test-Path $appPath)) {
            throw "Packaged application executable not found: $appPath"
          }
          $smokeStdoutPath = Join-Path $env:RUNNER_TEMP 'packaged-smoke-stdout.log'
          $smokeStderrPath = Join-Path $env:RUNNER_TEMP 'packaged-smoke-stderr.log'
          $process = Start-Process -FilePath $appPath -PassThru -Wait -RedirectStandardOutput $smokeStdoutPath -RedirectStandardError $smokeStderrPath
          if ($process.ExitCode -ne 0) {
            if (Test-Path $reportPath) {
              $details = (Get-Content -Raw $reportPath).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Packaged smoke diagnostics::$details"
            }
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path $reportPath)) {
            throw 'Packaged application did not write the deterministic WebM export measurements.'
          }
          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if (-not $report.pass) {
            throw "Deterministic WebM frame-count, duration, or decoded A/V-offset gate failed: $($report | ConvertTo-Json -Depth 8 -Compress)"
          }
          @"
          ## Packaged Windows deterministic WebM export smoke
          - Expected: $($report.expected.frameCount) frames at $($report.expected.frameRate.numerator)/$($report.expected.frameRate.denominator) fps; frame-aligned video duration $($report.expected.frameAlignedVideoDurationSeconds)s.
          - Frame counts: requested $($report.counts.requested), rendered $($report.counts.rendered), submitted $($report.counts.submitted), encoded $($report.counts.encoded), output file $($report.counts.outputFile).
          - Video: $($report.actual.videoDurationSeconds)s (delta $($report.actual.videoDurationDeltaSeconds)s), measured rate $($report.actual.measuredVideoFrameRate) fps, $($report.actual.videoDimensions.width)x$($report.actual.videoDimensions.height).
          - Audio: $($report.actual.audioDurationSeconds)s (delta $($report.actual.audioDurationDeltaSeconds)s); container: $($report.actual.containerDurationSeconds)s (delta $($report.actual.containerDurationDeltaSeconds)s).
          - Decoded synthetic signal A/V offset: expected $($report.expected.audioMinusVideoOffsetSeconds)s, measured $($report.actual.decodedAvOffset.audioMinusVideoOffsetSeconds)s, error $($report.actual.avOffsetErrorSeconds)s; one-frame tolerance $($report.expected.oneFrameToleranceSeconds)s.
          - One-frame duration and A/V-offset tolerances: $($report.expected.oneFrameToleranceSeconds)s. Gate: PASS.
          - Frame identity: $($report.frameIdentity.actual.decodedFileFrames)/$($report.frameIdentity.expected.frames) decoded frames matched source A/B frame IDs and black-gap/offline expectations; $($report.frameIdentity.mismatchCount) mismatches. Fixture includes cuts, trims, adjacent split clips, a 5-frame gap, and a 5-frame offline clip.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $invariant = [System.Globalization.CultureInfo]::InvariantCulture
          $videoDuration = ([double]$report.actual.videoDurationSeconds).ToString('0.000000', $invariant)
          $audioDuration = ([double]$report.actual.audioDurationSeconds).ToString('0.000000', $invariant)
          $containerDuration = ([double]$report.actual.containerDurationSeconds).ToString('0.000000', $invariant)
          $avOffset = ([double]$report.actual.decodedAvOffset.audioMinusVideoOffsetSeconds).ToString('0.000000', $invariant)
          $avOffsetError = ([double]$report.actual.avOffsetErrorSeconds).ToString('0.000000', $invariant)
          $durationTolerance = ([double]$report.expected.oneFrameToleranceSeconds).ToString('0.000000', $invariant)
          $summary = "PASS $($report.counts.encoded)/$($report.expected.frameCount) A/V frames @$($report.expected.frameRate.numerator)/$($report.expected.frameRate.denominator)fps; v=${videoDuration}s a=${audioDuration}s c=${containerDuration}s; av=${avOffset}s/err=${avOffsetError}s; id=$($report.frameIdentity.actual.decodedFileFrames)/$($report.frameIdentity.expected.frames),err=$($report.frameIdentity.mismatchCount); tol=${durationTolerance}s"
          "summary=$summary" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish Windows WebM smoke measurements
        uses: actions/github-script@v7
        env:
          SMOKE_SUMMARY: ${{ steps.packaged-smoke.outputs.summary }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Windows deterministic WebM export',
              description: process.env.SMOKE_SUMMARY,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Upload installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ClipWright-Windows-build-diagnostics
          path: |
            ${{ runner.temp }}/windows-installer-build.log
            ${{ runner.temp }}/deterministic-webm-smoke.json
            ${{ runner.temp }}/packaged-smoke-stdout.log
            ${{ runner.temp }}/packaged-smoke-stderr.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v7
        with:
          name: ClipWright-Windows-unsigned-x64
          path: release/ClipWright-Studio-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
